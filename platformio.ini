; PlatformIO Project Configuration File
; NightKite Link - M5Stack Cardputer and Tab5 service terminals

[platformio]
default_envs = cardputer, tab5

[env:cardputer]
; Both targets deliberately share one toolchain. PlatformIO otherwise swaps
; global Arduino framework packages between incompatible platform releases.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino

build_src_filter =
    +<*>
    -<targets/tab5/>

monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder

upload_speed = 1500000
extra_scripts =
    pre:scripts/patch_m5cardputer.py

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D CORE_DEBUG_LEVEL=1
    -D NIGHTKITE_USB_HOST=1

lib_deps =
    https://github.com/bblanchon/ArduinoJson.git#v7.4.3
    https://github.com/m5stack/M5GFX.git#0.2.20
    https://github.com/m5stack/M5Unified.git#0.2.14
    https://github.com/Arduino-IRremote/Arduino-IRremote.git#v4.7.1
    https://github.com/m5stack/M5Cardputer.git#1.1.1
    https://github.com/bertmelis/USBHostSerial.git

[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = m5stack-tab5-p4
; ESP-IDF owns the per-target Kconfig while Arduino remains the application API.
; This keeps the C6 Hosted-NimBLE configuration isolated from Cardputer.
framework = arduino, espidf
board_build.partitions = partitions_tab5.csv

monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder

upload_speed = 1500000
extra_scripts =
    pre:scripts/patch_usbhostserial.py

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D NIGHTKITE_TARGET_TAB5=1
    -D NIGHTKITE_USB_HOST=1
    -D USBHOSTSERIAL_BUFFERSIZE=8192

lib_deps =
    https://github.com/bblanchon/ArduinoJson.git#v7.4.3
    https://github.com/m5stack/M5GFX.git#0.2.26
    https://github.com/m5stack/M5Unified.git#0.2.19
    https://github.com/bertmelis/USBHostSerial.git
